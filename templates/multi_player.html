<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>VIBE - Mando Jugador</title>
    <style>
        :root { --p-color: #00ffcc; --bg: #050505; }
        body { background: var(--bg); color: white; font-family: 'Inter', sans-serif; margin: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; min-height: 100vh; }
        .panel { width: 90%; max-width: 400px; text-align: center; }
        .hidden { display: none !important; }
        .btn-vibe { width: 100%; padding: 35px; background: var(--p-color); border: none; border-radius: 30px; color: black; font-weight: 900; font-size: 2.2em; cursor: pointer; box-shadow: 0 0 25px var(--p-color); text-transform: uppercase; }
        .btn-disabled { opacity: 0.15; box-shadow: none; pointer-events: none; }
        input { width: 100%; padding: 20px; background: #111; color: white; border: 2px solid #333; border-radius: 20px; margin-bottom: 25px; text-align: center; font-size: 1.3em; box-sizing: border-box; }
        #feedback-puntos { font-size: 4em; font-weight: 900; margin-top: 20px; animation: pop 0.5s ease-out; }
        @keyframes pop { 0% { transform: scale(0.5); } 100% { transform: scale(1); } }
    </style>
</head>
<body>
    <div id="view-login" class="panel">
        <h1 style="letter-spacing:5px;">VIBE</h1>
        <input type="text" id="nombre-input" placeholder="TU NOMBRE">
        <button class="btn-vibe" onclick="unirse()">ENTRAR</button>
    </div>

    <div id="view-play" class="panel hidden">
        <h2 id="txt-status" style="margin-bottom:30px; opacity:0.6;">ESPERANDO...</h2>
        <button id="btn-lo-se" class="btn-vibe btn-disabled" onclick="pulsarLoSe()">¡LO SÉ!</button>
        <div id="feedback-puntos"></div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <script>
        const socket = io();
        let miNombre = "";

        function unirse() {
            miNombre = document.getElementById('nombre-input').value.trim();
            if(miNombre) {
                socket.emit('join', {nombre: miNombre});
                document.getElementById('view-login').classList.add('hidden');
                document.getElementById('view-play').classList.remove('hidden');
            }
        }

        function pulsarLoSe() {
            socket.emit('lo_se');
            document.getElementById('btn-lo-se').classList.add('btn-disabled');
        }

        socket.on('player_config', d => { document.documentElement.style.setProperty('--p-color', d.color); });

        socket.on('activar_boton_vibe', () => {
            const btn = document.getElementById('btn-lo-se');
            btn.classList.remove('btn-disabled');
            document.getElementById('txt-status').innerText = "¡DALE YA!";
            document.getElementById('feedback-puntos').innerText = "";
        });

        socket.on('jugador_lo_sabe', d => {
            const btn = document.getElementById('btn-lo-se');
            btn.classList.add('btn-disabled');
            document.getElementById('txt-status').innerText = d.nombre + " HA PULSADO";
        });

        socket.on('animar_puntuacion', d => {
            const f = document.getElementById('feedback-puntos');
            f.innerText = d.es_corona ? "👑" : (d.puntos_ronda > 0 ? "+" : "") + d.puntos_ronda;
            f.style.color = d.puntos_ronda >= 0 ? "#00ffcc" : "#ff3300";
        });

        socket.on('cambio_estado', d => {
            if(d.estado === 'listo') {
                document.getElementById('txt-status').innerText = "PREPÁRATE...";
                document.getElementById('btn-lo-se').classList.add('btn-disabled');
            }
        });
    </script>
</body>
</html>
