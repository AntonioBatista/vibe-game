<!DOCTYPE html>
<html>
<head>
    <title>VIBE HOST - PREMIUM</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
    <style>
        :root { --cyan: #00ffcc; --magenta: #ff00ff; }
        body { background: #0a0a0a; color: white; font-family: 'Segoe UI', sans-serif; text-align: center; overflow: hidden; margin:0; }
        .panel { display: flex; flex-direction: column; height: 100vh; justify-content: center; align-items: center; transition: 0.5s; }
        .hidden { display: none !important; }
        .btn-host { background: none; border: 2px solid var(--cyan); color: var(--cyan); padding: 15px 40px; font-size: 1.2em; cursor: pointer; border-radius: 50px; transition: 0.3s; }
        .btn-host:hover { background: var(--cyan); color: black; box-shadow: 0 0 20px var(--cyan); }
        #game-screen { background: radial-gradient(circle, #1a1a1a 0%, #000 100%); }
        .artista-text { font-size: 4em; font-weight: 900; text-transform: uppercase; margin: 10px 0; }
        .cancion-text { font-size: 2em; color: var(--cyan); opacity: 0.8; }
        #disco { width: 350px; height: 350px; border-radius: 50%; border: 10px solid #222; box-shadow: 0 0 50px rgba(0,0,0,0.8); margin-bottom: 20px; }
        .rotating { animation: rotate 3s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .btn-era { background: #222; border: 1px solid #444; color: white; padding: 10px; cursor: pointer; border-radius: 10px; }
        .btn-era.active { background: var(--cyan); color: black; border-color: var(--cyan); font-weight: bold; }
        #eras-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 20px 0; }
        .loading-bar { width: 100%; height: 5px; background: #222; position: fixed; top: 0; left: 0; }
        #progress { width: 0%; height: 100%; background: var(--cyan); transition: 0.3s; }
    </style>
</head>
<body>

    <div class="loading-bar"><div id="progress"></div></div>

    <div id="view-intro" class="panel">
        <div style="margin: auto;">
            <h1 style="font-size: 5em; color: var(--cyan); letter-spacing: 10px; margin-bottom: 10px;">VIBE</h1>
            <div style="background:white; padding:15px; border-radius:20px; margin: 20px; display: inline-block; box-shadow: 0 0 30px rgba(0,255,204,0.4);">
                <img id="qr-img" src="" width="220">
            </div>
            <p style="font-size: 1.5em; color: var(--cyan); font-family: monospace; letter-spacing: 2px;">
                <span id="url-display">CARGANDO...</span>
            </p>
            <div id="players-list" style="display:flex; justify-content: center; gap:15px; font-weight: bold; min-height: 50px; margin-top: 20px;"></div>
            <button id="btn-to-config" class="hidden btn-host" onclick="irA('config')" style="margin-top:30px;">CONFIGURAR PARTIDA</button>
        </div>
    </div>

    <div id="view-config" class="panel hidden">
        <div style="background: #111; padding: 40px; border-radius: 30px; border: 1px solid #333; width: 400px;">
            <h2 style="color:var(--cyan)">DÉCADAS</h2>
            <div id="eras-grid">
                <button class="btn-era active" onclick="this.classList.toggle('active')">60s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">70s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">80s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">90s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">00s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">10s</button>
                <button class="btn-era active" onclick="this.classList.toggle('active')">20s</button>
            </div>
            <div style="margin: 20px 0;">
                <label>SOLO ESPAÑOL <input type="checkbox" id="check-es"></label>
            </div>
            <div style="margin: 20px 0;">
                <label>CANCIONES: <b id="val-num" style="color:var(--cyan)">10</b></label><br>
                <input type="range" id="slider-songs" min="5" max="30" value="10" oninput="document.getElementById('val-num').innerText=this.value" style="width:100%; margin-top:10px;">
            </div>
            <button class="btn-host" onclick="empezarPartida()">EMPEZAR</button>
        </div>
    </div>

    <div id="view-game" class="panel hidden">
        <div id="status-msg" style="font-size: 2em; color: var(--cyan); margin-bottom: 20px;">PREPÁRATE...</div>
        <div id="disco-container" class="hidden">
            <img id="disco" src="{{ url_for('static', filename='disco.png') }}" class="rotating">
            <div id="player-indicator" style="font-size: 3em; font-weight: 900; margin-top: 20px;"></div>
        </div>
        <div id="info-res" class="hidden">
            <img id="res-portada" style="width:300px; border-radius:20px; box-shadow: 0 0 30px rgba(0,0,0,0.5);">
            <div class="artista-text" id="res-artista"></div>
            <div class="cancion-text" id="res-cancion"></div>
            <div id="res-anyo" style="font-size: 1.5em; color: #666; margin-top: 10px;"></div>
        </div>
    </div>

    <div id="view-winner" class="panel hidden">
        <h1 style="font-size: 4em; color: var(--cyan);">¡FIN DE PARTIDA!</h1>
        <div id="winner-card" style="padding: 40px; border-radius: 30px; margin: 20px;">
            <h2 id="winner-name" style="font-size: 5em; margin: 0;"></h2>
            <p id="winner-points" style="font-size: 2em;"></p>
        </div>
        <button class="btn-host" onclick="location.reload()">NUEVA PARTIDA</button>
    </div>

    <audio id="audio-player"></audio>

    <script>
        const socket = io();
        const rawIp = "{{ ip }}";
        
        // Configuración de URL y QR dinámica para Render/Local
        const protocol = rawIp.includes(':') ? 'http://' : 'https://';
        const fullUrl = protocol + rawIp + '/unirse';
        document.getElementById('qr-img').src = "https://api.qrserver.com/v1/create-qr-code/?size=250x250&data=" + encodeURIComponent(fullUrl);
        document.getElementById('url-display').innerText = (protocol + rawIp).toUpperCase();

        function irA(view) {
            document.querySelectorAll('.panel').forEach(p => p.classList.add('hidden'));
            document.getElementById('view-' + view).classList.remove('hidden');
        }

        socket.on('update_players', (jugadores) => {
            const list = document.getElementById('players-list');
            list.innerHTML = '';
            let count = 0;
            for (let id in jugadores) {
                count++;
                const p = jugadores[id];
                list.innerHTML += `<div style="color:${p.color}; border-bottom: 3px solid ${p.color}; padding: 5px 15px;">${p.nombre} [${p.puntos}]</div>`;
            }
            if (count >= 1) document.getElementById('btn-to-config').classList.remove('hidden');
        });

        function empezarPartida() {
            const decadas = Array.from(document.querySelectorAll('.btn-era.active')).map(b => b.innerText.replace('s',''));
            if (decadas.length === 0) { alert("Selecciona al menos una década"); return; }
            
            socket.emit('pre_configurar', {
                decadas: decadas,
                solo_espanol: document.getElementById('check-es').checked,
                num_canciones: document.getElementById('slider-songs').value
            });
            irA('game');
        }

        socket.on('progreso_carga', (data) => {
            const p = (data.count / data.total) * 100;
            document.getElementById('progress').style.width = p + '%';
            document.getElementById('status-msg').innerText = `CARGANDO BIBLIOTECA... ${data.count}/${data.total}`;
        });

        socket.on('play_song', (data) => {
            irA('game');
            document.getElementById('progress').style.width = '0%';
            document.getElementById('status-msg').innerText = "ESCUCHA CON ATENCIÓN...";
            document.getElementById('disco-container').classList.remove('hidden');
            document.getElementById('info-res').classList.add('hidden');
            document.getElementById('player-indicator').innerText = '';
            
            const audio = document.getElementById('audio-player');
            audio.src = data.preview;
            audio.play().then(() => {
                socket.emit('musica_on');
            });
        });

        socket.on('jugador_lo_sabe', (data) => {
            document.getElementById('audio-player').pause();
            document.getElementById('status-msg').innerText = "¡ALGUIEN LO SABE!";
            const ind = document.getElementById('player-indicator');
            ind.innerText = data.nombre;
            ind.style.color = data.color;
        });

        socket.on('mostrar_info_movil', (data) => {
            document.getElementById('disco-container').classList.add('hidden');
            document.getElementById('info-res').classList.remove('hidden');
            document.getElementById('res-portada').src = data.portada;
            document.getElementById('res-artista').innerText = data.artista;
            document.getElementById('res-cancion').innerText = data.cancion;
            document.getElementById('res-anyo').innerText = data.anyo;
            document.getElementById('status-msg').innerText = "SOLUCIÓN";
        });

        socket.on('final_partida', (data) => {
            irA('winner');
            const card = document.getElementById('winner-card');
            card.style.border = `5px solid ${data.ganador.color}`;
            card.style.boxShadow = `0 0 50px ${data.ganador.color}`;
            document.getElementById('winner-name').innerText = data.ganador.nombre;
            document.getElementById('winner-name').style.color = data.ganador.color;
            document.getElementById('winner-points').innerText = `${data.ganador.puntos} PUNTOS`;
        });

        socket.on('cambio_estado', (data) => {
            if (data.estado === "preparate") {
                document.getElementById('status-msg').innerText = "SIGUIENTE CANCIÓN...";
                document.getElementById('info-res').classList.add('hidden');
            }
        });
    </script>
</body>
</html>
